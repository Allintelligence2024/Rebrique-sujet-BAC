name: Fetch clean BAC PDF

# One-shot fetch from a runner that can reach the source. The sandbox cannot.
# Must run from this branch: workflow_dispatch is only registered on the default
# branch. The path filter stops the PDF commit this job pushes from retriggering it.
on:
  push:
    branches: [arena/01a0c9d4-rebrique-sujet-bac]
    paths:
      - .github/workflows/fetch-clean-pdf.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download candidate official subjects
        run: |
          set -euo pipefail
          mkdir -p incoming/se-2023
          download() {
            local url="$1" dest="$2"
            echo "GET $url"
            if curl -fL --retry 4 --retry-delay 2 -A "Mozilla/5.0" -o "$dest" "$url"; then
              if head -c 5 "$dest" | grep -q '%PDF'; then
                echo "OK $dest $(wc -c < "$dest") bytes"
                return 0
              fi
              echo "NOT A PDF: $dest"
              file "$dest" || true
              rm -f "$dest"
            else
              echo "FAIL $url"
            fi
            return 1
          }
          download "https://www.ency-education.com/uploads/3/0/9/3/309326/bac2023-sciences-se.pdf" \
            incoming/se-2023/ency-bac2023-sciences-se.pdf || true
          download "https://bac-algerie.net/sujets/2023/bac2023-Sciences-experimentales.pdf" \
            incoming/se-2023/bac-algerie-2023-se.pdf || true
          download "https://eddirasa.com/wp-content/uploads/2023/06/eddirasa.com-bac-sciences-se-2023.pdf" \
            incoming/se-2023/eddirasa-bac-sciences-se-2023.pdf || true
          mkdir -p incoming/se-2014
          download "https://eddirasa.com/wp-content/uploads/2014/06/eddirasa-com-bac-sci-science-2014.pdf" \
            incoming/se-2014/eddirasa-bac-sci-science-2014.pdf || true
          download "https://www.dzexams.com/uploads/sujets/officiels/bac/2023/dzexams-bac-sciences-naturelles-1780707.pdf" \
            incoming/se-2023/dzexams-bac-sciences-naturelles-1780707.pdf || true
          ls -la incoming/se-2023
          find incoming/se-2023 -type f -name '*.pdf' | grep -q .

      - name: Download SE 2019 Sciences candidates (text-layer fix)
        run: |
          set -euo pipefail
          mkdir -p incoming/se-2019
          download() {
            local url="$1" dest="$2"
            echo "GET $url"
            if curl -fL --retry 4 --retry-delay 2 -A "Mozilla/5.0" -o "$dest" "$url"; then
              if head -c 5 "$dest" | grep -q '%PDF'; then
                echo "OK $dest $(wc -c < "$dest") bytes"
                return 0
              fi
              echo "NOT A PDF: $dest"
              file "$dest" || true
              rm -f "$dest"
            else
              echo "FAIL $url"
            fi
            return 1
          }
          # Source exacte référencée par subjects/manifest.json (peut avoir changé depuis).
          download "https://www.dzexams.com/uploads/sujets/officiels/bac/2019/dzexams-bac-sciences-3051478.pdf" \
            incoming/se-2019/dzexams-2019-current.pdf || true
          # Mêmes motifs d'URL que les candidats SE 2023 déjà validés.
          download "https://www.ency-education.com/uploads/3/0/9/3/309326/bac2019-sciences-se.pdf" \
            incoming/se-2019/ency-2019-se.pdf || true
          download "https://bac-algerie.net/sujets/2019/bac2019-Sciences-experimentales.pdf" \
            incoming/se-2019/bac-algerie-2019-se.pdf || true
          download "https://eddirasa.com/wp-content/uploads/2019/06/eddirasa.com-bac-sciences-se-2019.pdf" \
            incoming/se-2019/eddirasa-2019-se.pdf || true
          download "https://eddirasa.com/wp-content/uploads/2019/06/eddirasa-com-bac-se-science-2019.pdf" \
            incoming/se-2019/eddirasa-2019-se-alt.pdf || true
          # Ratissage : page de recherche eddirasa → liens .pdf 2019 sciences.
          echo "--- scrape eddirasa search ---"
          curl -sL --retry 2 -A "Mozilla/5.0" "https://eddirasa.com/?s=bac+2019+sciences" \
            | grep -o 'https://eddirasa\.com[^"]*\.pdf' | sort -u | head -8 || true
          curl -sL --retry 2 -A "Mozilla/5.0" "https://eddirasa.com/?s=bac+2019+sciences" \
            | grep -o 'https://eddirasa\.com[^"]*\.pdf' | sort -u | head -8 \
            | nl -v0 | while read -r n u; do download "$u" "incoming/se-2019/eddirasa-scrape-$n.pdf" || true; done
          ls -la incoming/se-2019
          find incoming/se-2019 -type f -name '*.pdf' | grep -q .

      - uses: actions/upload-artifact@v4
        with:
          name: se-2023-candidates
          path: incoming/se-2023
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: se-2019-candidates
          path: incoming/se-2019
          if-no-files-found: error

      - name: Commit the PDFs so they can be pulled over github.com
        run: |
          set -euo pipefail
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "41898282+arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add incoming/se-2023 incoming/se-2014 incoming/se-2019
          git status
          if git diff --cached --quiet; then
            echo "No new PDF to commit"
            exit 0
          fi
          git commit -m "Fetch SE 2019 subject candidates for text-layer check"
          git push origin "HEAD:${{ github.ref_name }}"
