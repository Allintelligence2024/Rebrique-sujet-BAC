name: Fetch or rebuild BAC PDFs

# One-shot fetch/rebuild from a runner that can reach the sources and run apt.
# The sandbox can do neither (TLS allowlist, no tesseract).
# Must run from this branch: workflow_dispatch is only registered on the default
# branch. The path filter stops the PDF commit this job pushes from retriggering it.
on:
  push:
    branches: [arena/01a0c9d4-rebrique-sujet-bac]
    paths:
      - .github/workflows/fetch-clean-pdf.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download candidate official subjects
        run: |
          set -euo pipefail
          mkdir -p incoming/se-2023
          download() {
            local url="$1" dest="$2"
            echo "GET $url"
            if curl -fL --retry 4 --retry-delay 2 -A "Mozilla/5.0" -o "$dest" "$url"; then
              if head -c 5 "$dest" | grep -q '%PDF'; then
                echo "OK $dest $(wc -c < "$dest") bytes"
                return 0
              fi
              echo "NOT A PDF: $dest"
              file "$dest" || true
              rm -f "$dest"
            else
              echo "FAIL $url"
            fi
            return 1
          }
          download "https://www.ency-education.com/uploads/3/0/9/3/309326/bac2023-sciences-se.pdf" \
            incoming/se-2023/ency-bac2023-sciences-se.pdf || true
          download "https://bac-algerie.net/sujets/2023/bac2023-Sciences-experimentales.pdf" \
            incoming/se-2023/bac-algerie-2023-se.pdf || true
          download "https://eddirasa.com/wp-content/uploads/2023/06/eddirasa.com-bac-sciences-se-2023.pdf" \
            incoming/se-2023/eddirasa-bac-sciences-se-2023.pdf || true
          mkdir -p incoming/se-2014
          download "https://eddirasa.com/wp-content/uploads/2014/06/eddirasa-com-bac-sci-science-2014.pdf" \
            incoming/se-2014/eddirasa-bac-sci-science-2014.pdf || true
          download "https://www.dzexams.com/uploads/sujets/officiels/bac/2023/dzexams-bac-sciences-naturelles-1780707.pdf" \
            incoming/se-2023/dzexams-bac-sciences-naturelles-1780707.pdf || true
          ls -la incoming/se-2023
          find incoming/se-2023 -type f -name '*.pdf' | grep -q .

      # Série SE 2015→2024 (2019 déjà livré, exclu) : même pipeline LOGIQUE
      # (scripts/ocr-logical-layer.py) sur chaque sujet : rendu 300 dpi →
      # tesseract TSV → tri RTL → visuel bidi exact → qpdf --overlay.
      # Boucle tolérante : un sujet en échec n'arrête pas la série.
      # Diagnostics dans incoming/se-rebuild/ (commité, logs Actions inaccessibles).
      - name: OCR SE 2015-2024 (logical layer batch rebuild)
        run: |
          set -euo pipefail
          mkdir -p incoming/se-rebuild
          {
            echo "## versions"
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ara tesseract-ocr-fra tesseract-ocr-eng qpdf
            sudo apt-get install -y -qq fonts-sil-lateef fonts-kacst fonts-hosny-amiri || echo "polices apt optionnelles indisponibles"
          pip install --quiet --break-system-packages pymupdf python-bidi
            tesseract --version | head -2
            qpdf --version
            python3 -c "import fitz; print('pymupdf OK')"
          } 2>&1 | tee incoming/se-rebuild/setup.txt
          failures=0
          : > incoming/se-rebuild/BATCH.txt
          for year in 2015 2016 2017 2018 2020 2021 2022 2023 2024; do
            for n in 1 2; do
              src="subjects/SE/$year/sujet-$n.pdf"
              dest="incoming/se-rebuild/$year-sujet-$n.pdf"
              qa="incoming/se-rebuild/qa-$year-sujet-$n.txt"
              if [ ! -f "$src" ]; then
                echo "SKIP $src absent" | tee -a incoming/se-rebuild/BATCH.txt
                continue
              fi
              echo "=== $src ===" | tee -a incoming/se-rebuild/BATCH.txt
              if python3 scripts/ocr-logical-layer.py "$src" "$dest" "$qa"; then
                echo "OK $dest $(wc -c < "$dest") bytes" | tee -a incoming/se-rebuild/BATCH.txt
              else
                echo "FAILED $src" | tee -a incoming/se-rebuild/BATCH.txt
                failures=$((failures+1))
              fi
            done
          done
          echo "failures=$failures" | tee -a incoming/se-rebuild/BATCH.txt
          ls -la incoming/se-rebuild
          find incoming/se-rebuild -type f -name '*.pdf' | grep -q .
          [ "$failures" -eq 0 ]

      - uses: actions/upload-artifact@v4
        with:
          name: se-2023-candidates
          path: incoming/se-2023
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: se-rebuild
          path: incoming/se-rebuild
          if-no-files-found: error

      - name: Commit the PDFs so they can be pulled over github.com
        if: always()
        run: |
          set -euo pipefail
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "41898282+arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add incoming/se-2023 incoming/se-2014 incoming/se-2019-logical incoming/se-rebuild
          git status
          if git diff --cached --quiet; then
            echo "No new PDF to commit"
            exit 0
          fi
          git commit -m "OCR SE 2015-2024 : couches LOGIQUES reconstruites (série)"
          git push origin "HEAD:${{ github.ref_name }}"
